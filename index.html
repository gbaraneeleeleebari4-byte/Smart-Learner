<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Smart CGPA Plus</title>
<style>
:root{
  --bg:#0f1733; --card:#1c2850; --text:#f2f5ff; --muted:#8ba0d4;
  --brand:#5b8dff; --brand2:#8b5cff; --err:#ff5d6c; --line:rgba(120,150,255,.2);
  --gold:#ffd700; --silver:#c0c0c0; --bronze:#cd7f32;
}
*{box-sizing:border-box; margin:0; padding:0; font-family:sans-serif; -webkit-tap-highlight-color:transparent;}
body{background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
.hide{display:none !important;}

/* Splash & Auth */
#splash, #auth{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; padding:20px;}
.logo{width:80px; height:80px; border-radius:24px; background:linear-gradient(135deg, var(--brand), var(--brand2)); display:grid; place-items:center; font-size:40px; margin-bottom:20px;}
.spinner{width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-card{background:var(--card); padding:24px; border-radius:16px; width:100%; max-width:400px; border:1px solid var(--line);}
input, textarea, select{width:100%; padding:14px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,0.2); color:white; margin-bottom:12px; outline:none; font-size:16px;}
button{width:100%; padding:14px; border-radius:10px; border:none; background:var(--brand); color:white; font-weight:bold; font-size:16px; margin-bottom:10px; cursor:pointer;}
button.ghost{background:transparent; border:1px solid var(--line);}

/* App Layout */
#app{display:none; flex-direction:column; height:100%;}
header{display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--card); border-bottom:1px solid var(--line); gap:10px;}
header div{display:flex; gap:10px; align-items:center;}
.badge{background:var(--err); color:white; font-size:10px; padding:2px 6px; border-radius:10px; position:absolute; top:0; right:0;}
main{flex:1; overflow-y:auto; padding:16px; padding-bottom:80px;}
nav{position:fixed; bottom:0; width:100%; display:flex; background:var(--card); border-top:1px solid var(--line); padding:10px 0;}
nav button{background:none; margin:0; color:var(--muted); font-size:12px; display:flex; flex-direction:column; align-items:center; gap:4px;}
nav button.active{color:var(--brand);}
nav button span{font-size:20px;}

/* UI Elements */
.card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; border:1px solid var(--line);}
.stat{display:flex; justify-content:space-between; padding:12px; background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:8px;}
.stat b{color:var(--brand);}

/* Chat */
#chat-area{display:none; flex-direction:column; height:100%; position:fixed; inset:0; z-index:100; background:var(--bg);}
#chat-header{display:flex; align-items:center; padding:16px; background:var(--card); gap:10px; border-bottom:1px solid var(--line);}
#chat-messages{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
.bubble{max-width:80%; padding:12px; border-radius:12px; font-size:14px; line-height:1.4; position:relative;}
.bubble.mine{align-self:flex-end; background:var(--brand); color:white; border-bottom-right-radius:2px;}
.bubble.theirs{align-self:flex-start; background:var(--card); border-bottom-left-radius:2px;}
.bubble .sender{font-size:11px; margin-bottom:4px; font-weight:bold; color:var(--gold);}
.chat-input-area{display:flex; padding:10px; background:var(--card); gap:10px; align-items:center;}
.chat-input-area input{margin:0; flex:1;}
.chat-input-area button{width:auto; margin:0; padding:10px 14px;}
#sticker-modal, #action-menu {display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:9999; flex-direction:column; align-items:center; justify-content:center;}

/* Podium */
.podium{display:flex; justify-content:center; align-items:flex-end; gap:10px; margin-top:20px; height:150px;}
.podium-step{width:60px; background:var(--card); border-radius:10px 10px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:10px; border:1px solid var(--line); border-bottom:none;}
.podium-step.first{height:130px; background:linear-gradient(0deg, var(--card), var(--gold));}
.podium-step.second{height:100px; background:linear-gradient(0deg, var(--card), var(--silver));}
.podium-step.third{height:80px; background:linear-gradient(0deg, var(--card), var(--bronze));}
.podium-step b{font-size:12px; color:#000; text-align:center;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logo">🎓</div>
  <h1>Smart CGPA Plus</h1>
  <div class="spinner" style="margin-top:20px"></div>
</div>

<!-- AUTH -->
<div id="auth" class="hide">
  <div class="logo">🎓</div>
  <h2 style="margin-bottom:20px">Welcome</h2>
  <div class="auth-card">
    <input id="email" type="email" placeholder="Email" />
    <input id="pass" type="password" placeholder="Password" />
    <button onclick="login()">Sign In</button>
    <button class="ghost" onclick="signup()">Create Account</button>
    <button class="ghost" onclick="googleLogin()">Continue with Google</button>
    <div id="auth-msg" style="color:var(--err); font-size:14px; text-align:center; margin-top:10px;"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <b>Smart CGPA</b>
    <span id="user-email" style="font-size:12px; color:var(--muted)"></span>
    <div style="position:relative; display:flex; gap:10px;">
      <button onclick="toggleNotifs()" style="width:auto; padding:6px 10px; margin:0; background:var(--card); position:relative;">🔔<span id="notif-count" class="badge hide">0</span></button>
      <button onclick="logout()" style="width:auto; padding:6px 12px; font-size:12px; margin:0; background:var(--err)">Logout</button>
    </div>
  </header>

  <main>
    <!-- Dashboard -->
    <div id="page-dash">
      <h3>Dashboard</h3>
      <div class="card" style="margin-top:12px">
        <div class="stat"><span>Current CGPA</span> <b id="d-cgpa">0.00</b></div>
        <div class="stat"><span>Total Units</span> <b id="d-units">0</b></div>
      </div>
      <button onclick="calc()">🧮 Calculate CGPA</button>
      <button onclick="startGame()" style="background:var(--brand2); margin-top:10px;">🎮 Play Quiz</button>
      <button id="daily-challenge-btn" onclick="startDailyChallenge()" style="display:none; background:var(--gold); color:#000; margin-top:10px;">⏳ Daily Challenge (7PM-8PM)</button>
      <button onclick="openAdmin()" id="admin-btn" style="display:none; background:var(--card); border:1px solid var(--line); margin-top:10px;">🛡️ Admin Panel</button>
    </div>

    <!-- AI Tutor -->
    <div id="page-ai" class="hide">
      <h3>AI Tutor</h3>
      <div id="ai-messages" class="card" style="margin-top:12px; min-height:300px; max-height:400px; overflow-y:auto;">
        <div class="bubble theirs" id="ai-greeting">Hello! I am your AI Tutor. Ask me anything.</div>
      </div>
      <div style="display:flex; gap:10px;">
        <input id="ai-input" placeholder="Ask a question..." style="margin:0" />
        <button onclick="askAI()" style="width:auto; padding:0 20px;">➤</button>
      </div>
    </div>

    <!-- Chat Rooms -->
    <div id="page-chat" class="hide">
      <h3>Study Groups</h3>
      <button onclick="createGroup()" style="margin-top:12px">+ Create Group</button>
      <div id="groups-list" style="margin-top:12px"></div>
    </div>

    <!-- Leaderboard (Podium) -->
    <div id="page-rank" class="hide">
      <h3>Leaderboard</h3>
      <div id="podium-container" style="margin-top:20px;"></div>
      <div id="lb-list" class="card" style="margin-top:16px;">Loading...</div>
    </div>
  </main>

  <nav>
    <button onclick="nav('dash', this)" class="active"><span>🏠</span>Home</button>
    <button onclick="nav('ai', this)"><span>🤖</span>Tutor</button>
    <button onclick="nav('chat', this)"><span>💬</span>Chat</button>
    <button onclick="nav('rank', this)"><span>🏆</span>Rank</button>
  </nav>
</div>

<!-- CHAT ROOM OVERLAY -->
<div id="chat-area">
  <div id="chat-header">
    <button onclick="closeChat()" style="width:auto; margin:0; background:none; font-size:20px;">←</button>
    <b id="chat-title">Room</b>
    <span id="chat-status" style="font-size:12px; color:var(--muted); margin-left:auto;">🟢 Online</span>
  </div>
  <div id="chat-messages"></div>
  <div class="chat-input-area">
    <button onclick="document.getElementById('sticker-modal').style.display='flex'" style="background:transparent; font-size:20px;">😀</button>
    <button onclick="recordVoice()" style="background:transparent; padding:10px;" id="mic-btn">🎤</button>
    <input id="chat-input" placeholder="Message..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- STICKER MODAL -->
<div id="sticker-modal">
  <div style="background:var(--card); padding:20px; border-radius:16px; width:90%; max-width:400px;">
    <h3 style="margin-bottom:16px;">Send Sticker</h3>
    <div id="sticker-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; font-size:32px; text-align:center; cursor:pointer;"></div>
    <button onclick="document.getElementById('sticker-modal').style.display='none'" style="margin-top:20px; background:transparent; border:1px solid var(--line);">Cancel</button>
  </div>
</div>

<!-- MESSAGE ACTION MENU (Long Press) -->
<div id="action-menu">
  <div style="background:var(--card); padding:20px; border-radius:16px; width:250px; display:flex; flex-direction:column; gap:10px;">
    <button onclick="copyMsg()" style="background:var(--card2); text-align:left;">📋 Copy</button>
    <button onclick="likeMsg()" style="background:var(--card2); text-align:left;">❤️ Like</button>
    <button onclick="delMsg()" style="background:var(--err); text-align:left;">🗑️ Delete</button>
    <button onclick="document.getElementById('action-menu').style.display='none'" style="background:transparent; border:1px solid var(--line);">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc, setDoc, deleteDoc, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBalfqEksKXbrcfVCqrrWkILx_V7up25Xs",
  authDomain: "smart-learn-hub-73667.firebaseapp.com",
  projectId: "smart-learn-hub-73667",
  storageBucket: "smart-learn-hub-73667.firebasestorage.app",
  messagingSenderId: "165458065701",
  appId: "1:165458065701:web:08a1bcfac2ae286b9502cc"
};
const AI_URL = "https://gbaraneeleeleebari4--1fb7caf2c99a11f1ad4c1607ee4eb77e.web.val.run";
const CLOUD_NAME = "bj3niwog";
const CLOUD_PRESET = "smart_cgpa_preset";
const ADMIN_EMAIL = "gbaraneeleeleebari4@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let ME = null, currentRoom = null, mediaRecorder = null, audioChunks = [], activeMsgId = null, activeMsgText = "";

setTimeout(() => { document.getElementById('splash').classList.add('hide'); document.getElementById('auth').classList.remove('hide'); }, 2000);

// Auth
window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value); } catch (e) { document.getElementById('auth-msg').innerText = e.message; } };
window.signup = async () => { try { const c = await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value); await setDoc(doc(db, "users", c.user.uid), { email: c.user.email, role: c.user.email === ADMIN_EMAIL ? "admin" : "student" }); } catch (e) { document.getElementById('auth-msg').innerText = e.message; } };
window.googleLogin = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { document.getElementById('auth-msg').innerText = e.message; } };
window.logout = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById('auth').classList.add('hide');
    document.getElementById('app').style.display = 'flex';
    document.getElementById('user-email').innerText = user.email;
    ME = { uid: user.uid, email: user.email, name: user.email.split('@')[0], role: user.email === ADMIN_EMAIL ? "admin" : "student" };
    
    if (ME.role === "admin") document.getElementById('admin-btn').style.display = "block";
    document.getElementById('ai-greeting').innerText = `Hello ${ME.name}! I am your AI Tutor. Ask me anything.`;
    
    loadGroups(); loadLeaderboard(); listenNotifs(); checkChallengeTime();
  } else {
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth').classList.remove('hide');
  }
});

// Navigation
window.nav = (page, btn) => {
  document.querySelectorAll('main > div').forEach(d => d.classList.add('hide'));
  document.getElementById('page-' + page).classList.remove('hide');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
};

// AI Tutor
window.askAI = async () => {
  const input = document.getElementById('ai-input');
  const text = input.value.trim(); if(!text) return;
  const box = document.getElementById('ai-messages');
  box.innerHTML += `<div class="bubble mine">${text}</div>`;
  input.value = ''; box.scrollTop = box.scrollHeight;
  const loading = document.createElement('div'); loading.className = 'bubble theirs'; loading.innerText = 'Thinking...';
  box.appendChild(loading);
  try {
    const res = await fetch(AI_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ messages: [{ role: 'user', content: text }] }) });
    const data = await res.json(); loading.innerText = data.reply || "No response";
  } catch(e) { loading.innerText = "Error connecting to AI"; }
  box.scrollTop = box.scrollHeight;
};

// Chat System
window.loadGroups = () => {
  onSnapshot(collection(db, "groups"), (snap) => {
    const list = document.getElementById('groups-list');
    if(snap.empty) { list.innerHTML = "<p style='color:gray'>No groups yet.</p>"; return; }
    list.innerHTML = snap.docs.map(d => `<div class="card" style="cursor:pointer" onclick="openChat('${d.id}','${d.data().name}')"><b>${d.data().name}</b></div>`).join('');
  });
};
window.createGroup = async () => { const name = prompt("Group Name:"); if(name) await addDoc(collection(db, "groups"), { name, owner: ME.uid, createdAt: serverTimestamp() }); };
window.openChat = (id, name) => {
  currentRoom = id; document.getElementById('chat-title').innerText = name;
  document.getElementById('chat-area').style.display = 'flex';
  document.getElementById('chat-status').innerText = "🟢 Online";
  
  onSnapshot(query(collection(db, "groups", id, "messages"), orderBy("createdAt", "asc")), (snap) => {
    const box = document.getElementById('chat-messages');
    box.innerHTML = snap.docs.map(d => {
      const m = d.data(); const mine = m.uid === ME.uid;
      let content = m.text;
      if(m.type === 'audio') content = `<audio controls src="${m.text}" style="max-width:100%"></audio>`;
      if(m.type === 'sticker') content = `<span style="font-size:40px">${m.text}</span>`;
      if(m.liked) content += ` <br><span style="font-size:20px">❤️</span>`;
      
      const senderName = m.role === 'admin' ? `👑 Super Admin` : m.name;
      return `<div class="bubble ${mine ? 'mine' : 'theirs'}" onmousedown="startPress('${d.id}', '${m.text}')" onmouseup="cancelPress()" oncontextmenu="showMenu(event, '${d.id}', '${m.text}')">
        ${!mine ? `<div class="sender">${senderName}</div>` : ''}
        ${content}
      </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
};
window.closeChat = () => { document.getElementById('chat-area').style.display = 'none'; currentRoom = null; };
window.sendMessage = async () => {
  const input = document.getElementById('chat-input'); const text = input.value.trim(); if(!text) return;
  input.value = '';
  await addDoc(collection(db, "groups", currentRoom, "messages"), { text, uid: ME.uid, name: ME.name, role: ME.role, type: 'text', createdAt: serverTimestamp() });
};

// Long Press & Actions
let pressTimer;
window.startPress = (id, text) => { pressTimer = setTimeout(() => { openActionMenu(id, text); }, 500); };
window.cancelPress = () => { clearTimeout(pressTimer); };
window.showMenu = (e, id, text) => { e.preventDefault(); openActionMenu(id, text); };
window.openActionMenu = (id, text) => { activeMsgId = id; activeMsgText = text; document.getElementById('action-menu').style.display = 'flex'; };
window.copyMsg = () => { navigator.clipboard.writeText(activeMsgText); alert("Copied!"); document.getElementById('action-menu').style.display = 'none'; };
window.likeMsg = async () => { await updateDoc(doc(db, "groups", currentRoom, "messages", activeMsgId), { liked: true }); document.getElementById('action-menu').style.display = 'none'; };
window.delMsg = async () => { try { await deleteDoc(doc(db, "groups", currentRoom, "messages", activeMsgId)); } catch(e) { alert("No permission."); } document.getElementById('action-menu').style.display = 'none'; };

// Cloudinary Voice Notes
window.recordVoice = async () => {
  const btn = document.getElementById('mic-btn');
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); btn.style.color = 'white'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      const form = new FormData(); form.append('file', blob); form.append('upload_preset', CLOUD_PRESET);
      btn.style.color = 'orange';
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {method: 'POST', body: form});
      const data = await res.json();
      await addDoc(collection(db, "groups", currentRoom, "messages"), { text: data.secure_url, uid: ME.uid, name: ME.name, role: ME.role, type: 'audio', createdAt: serverTimestamp() });
      stream.getTracks().forEach(t => t.stop()); btn.style.color = 'white';
    };
    mediaRecorder.start(); btn.style.color = 'red';
  } catch(e) { alert("Mic access denied"); }
};

// Stickers
const stickers = ["😂","❤️","🔥","👍","😭","🙏","🎉","💯","😎","😍","🤔","👏","🥳","😡","🤯","👀"];
document.getElementById('sticker-grid').innerHTML = stickers.map(s => `<span onclick="sendSticker('${s}')">${s}</span>`).join('');
window.sendSticker = async (sticker) => {
  await addDoc(collection(db, "groups", currentRoom, "messages"), { text: sticker, uid: ME.uid, name: ME.name, role: ME.role, type: 'sticker', createdAt: serverTimestamp() });
  document.getElementById('sticker-modal').style.display = 'none';
};

// Game / Daily Challenge
window.startGame = async () => {
  const snap = await getDocs(query(collection(db, "questions"), limit(5)));
  if (snap.empty) return alert("No questions. Admin must upload.");
  let questions = []; snap.forEach(d => questions.push(d.data()));
  runQuiz(questions, false);
};
window.startDailyChallenge = async () => {
  const snap = await getDocs(query(collection(db, "questions"), limit(10)));
  if (snap.empty) return alert("No questions. Admin must upload.");
  let questions = []; snap.forEach(d => questions.push(d.data()));
  runQuiz(questions, true);
};
function runQuiz(questions, isChallenge) {
  const pageDash = document.getElementById('page-dash');
  pageDash.innerHTML = `<h3>${isChallenge ? 'Daily Challenge' : '⚡ Quiz'}</h3><div class="card" style="margin-top:12px"><div id="game-progress" style="color:var(--muted);font-size:12px;margin-bottom:10px">Q 1 of ${questions.length}</div><h4 id="game-q" style="margin-bottom:16px"></h4><div id="game-opts"></div></div>`;
  let currentQ = 0, score = 0;
  const renderQ = () => {
    if (currentQ >= questions.length) {
      pageDash.innerHTML = `<h3>Game Over!</h3><div class="card" style="text-align:center;margin-top:12px"><h1 style="color:var(--brand);font-size:40px;">${score} / ${questions.length}</h1><button onclick="saveGameScore(${score}, ${isChallenge})">Save Score</button><button onclick="nav('dash', document.querySelector('nav button'))" style="background:transparent;border:1px solid var(--line);">Back</button></div>`;
      return;
    }
    const q = questions[currentQ];
    document.getElementById('game-progress').innerText = `Q ${currentQ + 1} of ${questions.length}`;
    document.getElementById('game-q').innerText = q.question;
    let html = "";
    if(q.image) html += `<img src="${q.image}" style="max-width:100%;border-radius:8px;margin-bottom:10px;" />`;
    html += ["A","B","C","D"].map(o => `<button onclick="answerQ('${o}', '${q.correct}')" style="text-align:left;background:var(--card);border:1px solid var(--line);margin-bottom:8px;">${o}. ${q['option'+o]}</button>`).join('');
    document.getElementById('game-opts').innerHTML = html;
  };
  window.answerQ = (choice, correct) => { if (choice === correct) score++; currentQ++; renderQ(); };
  renderQ();
}
window.saveGameScore = async (score, isChallenge) => { 
  await addDoc(collection(db, "leaderboard"), { name: ME.name, score, isChallenge, createdAt: serverTimestamp() }); 
  alert("Saved!"); nav('rank', document.querySelectorAll('nav button')[3]); 
};

// Leaderboard (Podium)
window.loadLeaderboard = () => {
  onSnapshot(collection(db, "leaderboard"), snap => {
    let items = []; snap.forEach(d => items.push(d.data()));
    items.sort((a,b) => b.score - a.score);
    
    const top3 = items.slice(0, 3);
    const rest = items.slice(3);
    
    const podium = document.getElementById('podium-container');
    if(top3.length > 0) {
      podium.innerHTML = `
        <div class="podium">
          ${top3[1] ? `<div class="podium-step second"><b>🥈 ${top3[1].name}</b><br>${top3[1].score}</div>` : '<div></div>'}
          ${top3[0] ? `<div class="podium-step first"><b>👑 ${top3[0].name}</b><br>${top3[0].score}</div>` : '<div></div>'}
          ${top3[2] ? `<div class="podium-step third"><b>🥉 ${top3[2].name}</b><br>${top3[2].score}</div>` : '<div></div>'}
        </div>
      `;
    } else { podium.innerHTML = ""; }
    
    const list = document.getElementById('lb-list');
    list.innerHTML = rest.length ? rest.map((u,i) => `<div class="stat"><span>#${i+4} ${u.name}</span> <b>${u.score} pts</b></div>`).join('') : "No other scores.";
  });
};

// 7 PM Challenge check
function checkChallengeTime() {
  setInterval(() => {
    const hour = new Date().getHours();
    if(hour === 19) document.getElementById('daily-challenge-btn').style.display = 'block'; // 7 PM
    else document.getElementById('daily-challenge-btn').style.display = 'none';
  }, 60000);

// Notifications
window.toggleNotifs = () => { document.getElementById('notif-count').classList.add('hide'); alert("No new notifications."); };
function listenNotifs() {
  onSnapshot(query(collection(db, "announcements"), orderBy("createdAt", "desc"), limit(1)), (snap) => {
    if (!snap.empty) {
      const msg = snap.docs[0].data().text;
      const time = snap.docs[0].data().createdAt;
      if (time && (Date.now() - time.toMillis() < 10000)) {
        document.getElementById('notif-count').classList.remove('hide');
        document.getElementById('notif-count').innerText = "1";
        alert("📢 ANNOUNCEMENT:\n\n" + msg);
      }
    }
  });
}

// CGPA Calculator
let calcCourses = [];
window.calc = () => {
  const pageDash = document.getElementById('page-dash');
  pageDash.innerHTML = `
    <h3>CGPA Calculator</h3>
    <div class="card" style="margin-top:12px">
      <select id="calc-scale" style="margin-bottom:12px">
        <option value="5">5.0 Scale</option>
        <option value="4">4.0 Scale</option>
      </select>
      <div style="display:flex;gap:10px;">
        <input id="calc-prevcgpa" type="number" placeholder="Prev CGPA" />
        <input id="calc-prevunits" type="number" placeholder="Prev Units" />
      </div>
    </div>
    <div id="calc-list"></div>
    <button onclick="addCalcCourse()" style="background:var(--card);border:1px solid var(--line);">+ Add Course</button>
    <div class="card" style="display:flex;justify-content:space-between;text-align:center;">
      <div><b id="calc-cgpa" style="display:block;font-size:24px;color:var(--brand)">0.00</b><span style="font-size:10px;color:var(--muted)">CGPA</span></div>
      <div><b id="calc-units" style="display:block;font-size:24px;color:var(--brand)">0</b><span style="font-size:10px;color:var(--muted)">Units</span></div>
    </div>
    <button onclick="nav('dash', document.querySelector('nav button'))" style="background:transparent;border:1px solid var(--line);">Back</button>
  `;
  renderCalc();
};
window.addCalcCourse = () => { calcCourses.push({ name: "", units: "", grade: "A" }); renderCalc(); };
window.removeCalcCourse = (i) => { calcCourses.splice(i, 1); renderCalc(); };
window.updateCalcCourse = (i, k, v) => { calcCourses[i][k] = v; calcGPA(); };
function renderCalc() {
  const list = document.getElementById('calc-list'); if(!list) return;
  const scaleVal = document.getElementById('calc-scale').value;
  const grades = scaleVal === "5" ? ["A","B","C","D","E","F"] : ["A","B","C","D","F"];
  list.innerHTML = calcCourses.map((c, i) => `<div class="card" style="padding:12px;"><input placeholder="Course" value="${c.name}" oninput="updateCalcCourse(${i},'name',this.value)" /><input type="number" placeholder="Units" value="${c.units}" oninput="updateCalcCourse(${i},'units',this.value)" /><select onchange="updateCalcCourse(${i},'grade',this.value)">${grades.map(g => `<option value="${g}" ${c.grade === g ? 'selected' : ''}>${g}</option>`).join('')}</select><button onclick="removeCalcCourse(${i})" style="background:var(--err)">Remove</button></div>`).join('');
  calcGPA();
}
function calcGPA() {
  const scaleVal = document.getElementById('calc-scale').value;
  const scale = scaleVal === "5" ? {A:5,B:4,C:3,D:2,E:1,F:0} : {A:4,B:3,C:2,D:1,F:0};
  let pts = 0, units = 0;
  calcCourses.forEach(c => { const u = Number(c.units)||0; pts += u * (scale[c.grade]||0); units += u; });
  const gpa = units ? pts/units : 0;
  const pC = parseFloat(document.getElementById('calc-prevcgpa').value)||0, pU = parseFloat(document.getElementById('calc-prevunits').value)||0, total = units + pU;
  const cgpa = total ? ((pC*pU)+(gpa*units))/total : gpa;
  document.getElementById('calc-cgpa').innerText = cgpa.toFixed(2);
  document.getElementById('calc-units').innerText = total;
  document.getElementById('d-cgpa').innerText = cgpa.toFixed(2);
  document.getElementById('d-units').innerText = total;
}
document.addEventListener('input', (e) => { if(e.target.id === 'calc-scale' || e.target.id === 'calc-prevcgpa' || e.target.id === 'calc-prevunits') calcGPA(); });
</script>
