<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0f1733" />
<title>Smart CGPA Plus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
<style>
/* ================= THEME & RESET ================= */
:root{
  --bg-1:#0f1a3d; --bg-2:#1a2a5e; --bg-3:#0a1230;
  --bg:#0f1733; --card:rgba(28,40,80,.85); --card-solid:#1c2850; --card-2:#243461;
  --line:rgba(120,150,255,.18); --line-strong:rgba(120,150,255,.35);
  --text:#f2f5ff; --text-2:#c9d3f5; --muted:#8ba0d4;
  --brand:#5b8dff; --brand-2:#8b5cff; --brand-3:#4dd4ff;
  --ok:#38d39f; --warn:#ffb84d; --err:#ff5d6c; --chatbg:#101a38;
  --bubble-me:#005c4b; --bubble-them:#202c33;
  --shadow-sm:0 2px 8px rgba(0,0,0,.25); --shadow:0 10px 30px rgba(0,0,0,.4);
  --radius:16px; --radius-lg:22px;
}
[data-theme="light"]{
  --bg-1:#eef2ff; --bg-2:#e2e9ff; --bg-3:#f5f7ff; --bg:#f2f5ff;
  --card:rgba(255,255,255,.92); --card-solid:#ffffff; --card-2:#f2f5ff;
  --line:rgba(60,90,180,.14); --line-strong:rgba(60,90,180,.28);
  --text:#0d1530; --text-2:#2a3a68; --muted:#5a6785;
  --brand:#3a6bff; --brand-2:#7a4cff; --brand-3:#00b8d4;
  --ok:#0ea37a; --warn:#d97706; --err:#e11d48; --chatbg:#efeae2;
  --bubble-me:#d9fdd3; --bubble-them:#ffffff;
  --shadow-sm:0 2px 8px rgba(20,40,100,.08); --shadow:0 10px 30px rgba(20,40,100,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}
.hide{display:none !important}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}

/* ================= SPLASH & AUTH ================= */
#splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease}
#splash.fade-out{opacity:0;pointer-events:none}
.splash-logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:40px;margin-bottom:20px;box-shadow:0 10px 30px rgba(91,141,255,.4)}
.splash-text{font-size:24px;font-weight:800;margin-bottom:8px}
.splash-sub{color:var(--muted);font-size:13px}
.spinner{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;margin-top:30px}
@keyframes spin{to{transform:rotate(360deg)}}

#authScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1000px 600px at 15% -10%, rgba(91,141,255,.45), transparent 60%),linear-gradient(160deg, var(--bg-1), var(--bg-3))}
.auth-card{position:relative;width:100%;max-width:420px;background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--line-strong);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.brand .logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg, var(--brand), var(--brand-2));display:grid;place-items:center;font-size:26px}
.brand h1{font-size:21px;margin:0;font-weight:800}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;margin:22px 0 8px;border:1px solid var(--line)}
.tabs button{flex:1;padding:10px;border-radius:10px;color:var(--muted);font-weight:700;font-size:14px}
.tabs button.active{background:linear-gradient(135deg, var(--brand), var(--brand-2));color:#fff}
.field{margin:14px 0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:700}
.field input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);outline:none;font-size:15px;color:var(--text)}
.field input:focus{border-color:var(--brand)}
.btn{width:100%;padding:14px;border-radius:13px;font-weight:800;font-size:15px;background:linear-gradient(135deg, var(--brand), var(--brand-2));color:#fff;margin-top:10px;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line-strong)}
.btn.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #dadce0;font-weight:700}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0 6px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.msg{font-size:13.5px;margin-top:14px;padding:11px 14px;border-radius:11px;text-align:center}
.msg.err{background:rgba(255,93,108,.14);color:#ffb4bd;border:1px solid rgba(255,93,108,.35)}
.msg.ok{background:rgba(56,211,159,.14);color:#a8f0d5;border:1px solid rgba(56,211,159,.35)}

/* ================= APP SHELL ================= */
#app{display:none;height:100%;flex-direction:column;background:var(--bg)}
#app.on{display:flex}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--card-solid);border-bottom:1px solid var(--line)}
header .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg, var(--brand), var(--brand-2));display:grid;place-items:center;font-size:20px}
header .titles{flex:1;min-width:0}
header .titles b{display:block;font-size:16px;font-weight:800}
header .titles span{font-size:11.5px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line-strong);font-size:18px;color:var(--text);position:relative}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--brand)}
main{flex:1;overflow-y:auto;padding:18px;padding-bottom:100px}
.page{display:none;animation:fade .28s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--card-solid);border-top:1px solid var(--line);padding:8px 6px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;color:var(--muted);font-size:10.5px;font-weight:700;border-radius:12px}
nav button.active{color:var(--brand)}
nav button .ic{font-size:20px;margin-bottom:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:17px;font-weight:800}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:12px}
.grid.k2{grid-template-columns:1fr 1fr}
.grid.k3{grid-template-columns:repeat(3,1fr)}
.stat{background:linear-gradient(135deg, rgba(91,141,255,.14), rgba(139,92,255,.10));border:1px solid var(--line-strong);border-radius:14px;padding:16px 12px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--brand)}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
input.mini,select.mini{padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);font-size:14px;width:100%;color:var(--text);outline:none}

/* ================= WHATSAPP CHAT UI ================= */
#chatRoom{position:fixed;inset:0;z-index:60;background:var(--chatbg);display:flex;flex-direction:column}
#chatRoomHeader{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card-solid);border-bottom:1px solid var(--line)}
#chatRoomHeader .info{flex:1}
#chatRoomHeader .info h3{margin:0;font-size:15px;font-weight:700}
#msgScroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat-bubble{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;position:relative;cursor:pointer;user-select:none}
.chat-bubble.mine{align-self:flex-end;background:var(--bubble-me);color:#fff;border-bottom-right-radius:4px}
.chat-bubble.theirs{align-self:flex-start;background:var(--bubble-them);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-bubble .sender{font-size:11px;color:var(--brand);font-weight:700;margin-bottom:4px}
.chat-bubble.mine .sender{color:rgba(255,255,255,0.8)}
.chat-bubble .time{font-size:10px;opacity:0.7;text-align:right;margin-top:4px}
.sticker{font-size:48px;line-height:1;margin-top:4px}

#msgMenu{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:70;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#msgMenuBox{background:var(--card-solid);border:1px solid var(--line-strong);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:200px}
#msgMenuBox button{padding:12px;border-radius:8px;background:var(--card-2);font-weight:600;display:flex;align-items:center;gap:10px}
#msgMenuBox button.danger{color:var(--err)}

#chatInputArea{padding:10px;background:var(--card-solid);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
#chatInputArea .input-wrap{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:24px;display:flex;align-items:center;padding:4px 8px}
#chatInputArea .input-wrap input{flex:1;background:transparent;border:none;outline:none;padding:8px;font-size:14px;color:var(--text)}
#chatInputArea .action-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted)}
#chatInputArea .send-btn{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px}

/* ================= AI TUTOR ================= */
#page-tutor{padding:0;display:none;flex-direction:column;height:100%}
#aiHeader{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card-solid)}
#aiHeader .avatar{width:44px;height:44px;border-radius:50%;background:rgba(91,141,255,.1);color:var(--brand);display:grid;place-items:center;font-size:24px}
#chatBox{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.chat-msg{max-width:85%;font-size:14px;line-height:1.5;padding:16px;border-radius:16px}
.chat-msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start;background:var(--card-solid);border:1px solid var(--line);border-bottom-left-radius:4px}
#aiInputArea{padding:16px 20px;background:var(--bg);border-top:1px solid var(--line)}
.ai-input-box{background:var(--card-solid);border:1px solid var(--line);border-radius:16px;padding:12px}
.ai-input-box input{width:100%;background:transparent;border:none;outline:none;font-size:15px;padding:8px 0;color:var(--text)}
.ai-input-tools{display:flex;align-items:center;gap:8px;margin-top:8px}
.ai-input-tools .send-btn{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px}

/* ================= MODALS & NOTIFICATIONS ================= */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-content{background:var(--card-solid);border:1px solid var(--line-strong);border-radius:var(--radius);padding:24px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.sticker-grid span{font-size:40px;text-align:center;cursor:pointer;padding:8px;border-radius:8px;transition:background 0.2s}
.sticker-grid span:hover{background:var(--card-2)}

.notif-banner{position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;background:var(--card-solid);border:1px solid var(--brand);border-radius:14px;padding:12px 16px;box-shadow:0 10px 25px rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;gap:12px;transition:top 0.4s ease}
.notif-banner.show{top:16px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card-solid);color:var(--text);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;border:1px solid var(--line)}
.toast.on{opacity:1}
</style>
</head>
<body>
