<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#4f7cff" />
<title>Smart CGPA Plus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
<style>
:root{
  --bg-1:#0f1a3d; --bg-2:#1a2a5e; --bg-3:#0a1230;
  --bg:#0f1733; --card:rgba(28,40,80,.85); --card-solid:#1c2850; --card-2:#243461;
  --line:rgba(120,150,255,.18); --line-strong:rgba(120,150,255,.35);
  --text:#f2f5ff; --text-2:#c9d3f5; --muted:#8ba0d4;
  --brand:#5b8dff; --brand-2:#8b5cff; --brand-3:#4dd4ff;
  --ok:#38d39f; --warn:#ffb84d; --err:#ff5d6c; --chatbg:#101a38;
  --shadow-sm:0 2px 8px rgba(0,0,0,.25); --shadow:0 10px 30px rgba(0,0,0,.4);
  --shadow-glow:0 0 40px rgba(91,141,255,.35);
  --radius:16px; --radius-lg:22px;
}
[data-theme="light"]{
  --bg-1:#eef2ff; --bg-2:#e2e9ff; --bg-3:#f5f7ff; --bg:#f2f5ff;
  --card:rgba(255,255,255,.92); --card-solid:#ffffff; --card-2:#f2f5ff;
  --line:rgba(60,90,180,.14); --line-strong:rgba(60,90,180,.28);
  --text:#0d1530; --text-2:#2a3a68; --muted:#5a6785;
  --brand:#3a6bff; --brand-2:#7a4cff; --brand-3:#00b8d4;
  --ok:#0ea37a; --warn:#d97706; --err:#e11d48; --chatbg:#e8edf7;
  --shadow-sm:0 2px 8px rgba(20,40,100,.08); --shadow:0 10px 30px rgba(20,40,100,.14);
  --shadow-glow:0 0 40px rgba(58,107,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}
.hide{display:none !important}

#authScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(1000px 600px at 15% -10%, rgba(91,141,255,.45), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(139,92,255,.40), transparent 55%),
    radial-gradient(700px 500px at 50% 120%, rgba(77,212,255,.25), transparent 60%),
    linear-gradient(160deg, var(--bg-1), var(--bg-3));
  position:relative;overflow:hidden}
#authScreen::before{content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.08) 1px, transparent 1px),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:60px 60px, 90px 90px;pointer-events:none}
.auth-card{position:relative;width:100%;max-width:420px;
  background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line-strong);border-radius:var(--radius-lg);
  padding:32px 28px 28px;box-shadow:var(--shadow), var(--shadow-glow)}
.auth-card::after{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.brand .logo{width:54px;height:54px;border-radius:16px;
  background:linear-gradient(135deg, var(--brand), var(--brand-2) 60%, var(--brand-3));
  display:grid;place-items:center;font-size:26px;
  box-shadow:0 8px 24px rgba(91,141,255,.5), inset 0 1px 0 rgba(255,255,255,.35)}
.brand h1{font-size:21px;margin:0;letter-spacing:-.4px;font-weight:800;
  background:linear-gradient(135deg, var(--text), var(--text-2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;font-weight:500}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;margin:22px 0 8px;border:1px solid var(--line)}
[data-theme="light"] .tabs{background:rgba(0,0,0,.04)}
.tabs button{flex:1;padding:10px;border-radius:10px;color:var(--muted);font-weight:700;font-size:14px;transition:all .2s}
.tabs button.active{background:linear-gradient(135deg, var(--brand), var(--brand-2));color:#fff;
  box-shadow:0 6px 16px rgba(91,141,255,.45)}
.field{margin:14px 0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:13px 15px;border-radius:12px;
  border:1px solid var(--line-strong);background:rgba(255,255,255,.05);
  outline:none;font-size:15px;transition:all .18s;color:var(--text)}
[data-theme="light"] .field input,
[data-theme="light"] .field select,
[data-theme="light"] .field textarea{background:#fff;border-color:rgba(60,90,180,.22)}
.field input::placeholder{color:var(--muted);opacity:.7}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--brand);background:rgba(91,141,255,.08);
  box-shadow:0 0 0 4px rgba(91,141,255,.18)}
.btn{width:100%;padding:14px;border-radius:13px;font-weight:800;font-size:15px;
  background:linear-gradient(135deg, var(--brand), var(--brand-2));
  color:#fff;margin-top:10px;transition:transform .12s, box-shadow .18s, filter .18s;
  box-shadow:0 8px 22px rgba(91,141,255,.4), inset 0 1px 0 rgba(255,255,255,.25);
  letter-spacing:.2px;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.18), transparent 40%);pointer-events:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.985);box-shadow:0 4px 12px rgba(91,141,255,.35)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm)}
[data-theme="light"] .btn.ghost{background:#fff}
.btn.danger{background:linear-gradient(135deg, #ff5d6c, #d92646);box-shadow:0 8px 22px rgba(255,93,108,.35)}
.btn.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid #dadce0;font-weight:700;box-shadow:var(--shadow-sm)}
.btn.google:hover{background:#f8f9fa}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0 6px;font-weight:600}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.msg{font-size:13.5px;margin-top:14px;padding:11px 14px;border-radius:11px;text-align:center;font-weight:500;line-height:1.45}
.msg.err{background:rgba(255,93,108,.14);color:#ffb4bd;border:1px solid rgba(255,93,108,.35)}
[data-theme="light"] .msg.err{color:#a01227}
.msg.ok{background:rgba(56,211,159,.14);color:#a8f0d5;border:1px solid rgba(56,211,159,.35)}
[data-theme="light"] .msg.ok{color:#046a4f}

#app{display:none;height:100%;flex-direction:column;background:var(--bg)}
#app.on{display:flex}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  background:linear-gradient(180deg, rgba(28,40,80,.95), rgba(28,40,80,.75));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)}
[data-theme="light"] header{background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.8))}
header .logo{width:42px;height:42px;border-radius:13px;
  background:linear-gradient(135deg, var(--brand), var(--brand-2) 60%, var(--brand-3));
  display:grid;place-items:center;font-size:20px;
  box-shadow:0 6px 18px rgba(91,141,255,.45), inset 0 1px 0 rgba(255,255,255,.35)}
header .titles{flex:1;min-width:0}
header .titles b{display:block;font-size:16px;letter-spacing:-.3px;font-weight:800;color:var(--text)}
header .titles span{font-size:11.5px;color:var(--muted);font-weight:500}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid var(--line-strong);font-size:18px;
  transition:all .18s;color:var(--text)}
[data-theme="light"] .icon-btn{background:#fff}
.icon-btn:hover{background:rgba(91,141,255,.2);border-color:var(--brand)}
.icon-btn:active{transform:scale(.94)}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--card-2);
  border:2px solid var(--brand);box-shadow:0 4px 12px rgba(91,141,255,.35)}
main{flex:1;overflow-y:auto;padding:18px;padding-bottom:100px;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(800px 400px at 100% 0%, rgba(91,141,255,.08), transparent 60%),
    radial-gradient(600px 400px at 0% 100%, rgba(139,92,255,.08), transparent 60%),
    var(--bg)}
.page{display:none}
.page.on{display:block;animation:fade .28s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:linear-gradient(180deg, rgba(28,40,80,.85), rgba(28,40,80,.98));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line);
  padding:8px 6px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(0,0,0,.35)}
[data-theme="light"] nav{background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.98))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 2px;color:var(--muted);font-size:10.5px;font-weight:700;
  border-radius:12px;transition:all .18s;position:relative}
nav button .ic{font-size:20px;line-height:1;transition:transform .2s}
nav button.active{color:var(--brand)}
nav button.active .ic{transform:translateY(-2px) scale(1.1)}
nav button.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg, var(--brand), var(--brand-2));
  box-shadow:0 2px 8px rgba(91,141,255,.6)}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);
  transition:border-color .2s, transform .2s}
.card:hover{border-color:var(--line-strong)}
.card h3{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5;font-weight:500}
.grid{display:grid;gap:12px}
.grid.k2{grid-template-columns:1fr 1fr}
.grid.k3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.grid.k3{grid-template-columns:1fr 1fr}}
.stat{background:linear-gradient(135deg, rgba(91,141,255,.14), rgba(139,92,255,.10));
  border:1px solid var(--line-strong);border-radius:14px;padding:16px 12px;text-align:center;
  transition:transform .2s;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg, var(--brand), var(--brand-2), var(--brand-3));opacity:.7}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-size:24px;letter-spacing:-.6px;font-weight:800;
  background:linear-gradient(135deg, var(--brand), var(--brand-3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:4px;display:block}
.pill{display:inline-block;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.08);border:1px solid var(--line-strong);color:var(--muted);letter-spacing:.3px}
.pill.brand{background:linear-gradient(135deg, rgba(91,141,255,.22), rgba(139,92,255,.18));
  color:#bfd0ff;border-color:rgba(91,141,255,.5)}
[data-theme="light"] .pill.brand{color:#3a5bd9}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:48px;display:block;margin-bottom:12px;opacity:.5;filter:grayscale(.3)}
.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.2);
  border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:36px;color:var(--muted);font-weight:600}
input.mini,select.mini{padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.05);font-size:14px;width:100%;transition:all .18s;color:var(--text);font-weight:500}
[data-theme="light"] input.mini,[data-theme="light"] select.mini{background:#fff;border-color:rgba(60,90,180,.22)}
input.mini:focus,select.mini:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 4px rgba(91,141,255,.18);background:rgba(91,141,255,.06)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:200;
  background:linear-gradient(135deg, #2a3a70, #1c2850);color:#fff;
  padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow), var(--shadow-glow);opacity:0;pointer-events:none;
  transition:opacity .28s, transform .28s;max-width:88vw;text-align:center;
  border:1px solid var(--line-strong);backdrop-filter:blur(20px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-8px)}
.toast.err{background:linear-gradient(135deg, #7f1d3a, #5c0f28);border-color:rgba(255,93,108,.5)}
.toast.ok{background:linear-gradient(135deg, #0e5f43, #074d33);border-color:rgba(56,211,159,.5)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,150,255,.3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,150,255,.5)}
</style>
</head>
<body>
