<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Smart CGPA Plus</title>
<style>
:root{
  --bg:#0f1733; --card:#1c2850; --text:#f2f5ff; --muted:#8ba0d4;
  --brand:#5b8dff; --brand2:#8b5cff; --err:#ff5d6c; --line:rgba(120,150,255,.2);
}
*{box-sizing:border-box; margin:0; padding:0; font-family:sans-serif; -webkit-tap-highlight-color:transparent;}
body{background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
.hide{display:none !important;}

/* Auth & Splash */
#splash, #auth{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; padding:20px;}
#auth{z-index:998;}
.logo{width:80px; height:80px; border-radius:24px; background:linear-gradient(135deg, var(--brand), var(--brand2)); display:grid; place-items:center; font-size:40px; margin-bottom:20px;}
.spinner{width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-card{background:var(--card); padding:24px; border-radius:16px; width:100%; max-width:400px; border:1px solid var(--line);}
input{width:100%; padding:14px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,0.2); color:white; margin-bottom:12px; outline:none; font-size:16px;}
button{width:100%; padding:14px; border-radius:10px; border:none; background:var(--brand); color:white; font-weight:bold; font-size:16px; margin-bottom:10px; cursor:pointer;}
button.ghost{background:transparent; border:1px solid var(--line);}

/* App Layout */
#app{display:none; flex-direction:column; height:100%;}
header{display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--card); border-bottom:1px solid var(--line);}
main{flex:1; overflow-y:auto; padding:16px; padding-bottom:80px;}
nav{position:fixed; bottom:0; width:100%; display:flex; background:var(--card); border-top:1px solid var(--line); padding:10px 0;}
nav button{background:none; margin:0; color:var(--muted); font-size:12px; display:flex; flex-direction:column; align-items:center; gap:4px;}
nav button.active{color:var(--brand);}
nav button span{font-size:20px;}

/* UI Elements */
.card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; border:1px solid var(--line);}
.stat{display:flex; justify-content:space-between; padding:12px; background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:8px;}
.stat b{color:var(--brand);}
.msg{color:var(--err); font-size:14px; text-align:center; margin-top:10px;}

/* Chat */
#chat-area{display:none; flex-direction:column; height:100%; position:fixed; inset:0; z-index:100; background:var(--bg);}
#chat-header{display:flex; align-items:center; padding:16px; background:var(--card); gap:10px;}
#chat-messages{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
.bubble{max-width:80%; padding:12px; border-radius:12px; font-size:14px; line-height:1.4;}
.bubble.mine{align-self:flex-end; background:var(--brand); color:white; border-bottom-right-radius:2px;}
.bubble.theirs{align-self:flex-start; background:var(--card); border-bottom-left-radius:2px;}
.chat-input-area{display:flex; padding:10px; background:var(--card); gap:10px;}
.chat-input-area input{margin:0; flex:1;}
.chat-input-area button{width:auto; margin:0; padding:10px 16px;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logo">🎓</div>
  <h1>Smart CGPA Plus</h1>
  <div class="spinner" style="margin-top:20px"></div>
</div>

<!-- AUTH -->
<div id="auth" class="hide">
  <div class="logo">🎓</div>
  <h2 style="margin-bottom:20px">Welcome</h2>
  <div class="auth-card">
    <input id="email" type="email" placeholder="Email" />
    <input id="pass" type="password" placeholder="Password" />
    <button onclick="login()">Sign In</button>
    <button class="ghost" onclick="signup()">Create Account</button>
    <button class="ghost" onclick="googleLogin()">Continue with Google</button>
    <div id="auth-msg" class="msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <b>Smart CGPA</b>
    <span id="user-email" style="font-size:12px; color:var(--muted)"></span>
    <button onclick="logout()" style="width:auto; padding:6px 12px; font-size:12px; margin:0; background:var(--err)">Logout</button>
  </header>

  <main>
    <!-- Dashboard -->
    <div id="page-dash">
      <h3>Dashboard</h3>
      <div class="card" style="margin-top:12px">
        <div class="stat"><span>Current CGPA</span> <b id="d-cgpa">0.00</b></div>
        <div class="stat"><span>Total Units</span> <b id="d-units">0</b></div>
      </div>
      <button onclick="calc()">Calculate CGPA</button>
    </div>

    <!-- AI Tutor -->
    <div id="page-ai" class="hide">
      <h3>AI Tutor</h3>
      <div id="ai-messages" class="card" style="margin-top:12px; min-height:300px; max-height:400px; overflow-y:auto;">
        <div class="bubble theirs">Hello! I am your AI Tutor. Ask me anything.</div>
      </div>
      <div style="display:flex; gap:10px;">
        <input id="ai-input" placeholder="Ask a question..." style="margin:0" />
        <button onclick="askAI()" style="width:auto; padding:0 20px;">➤</button>
      </div>
    </div>

    <!-- Chat Rooms -->
    <div id="page-chat" class="hide">
      <h3>Study Groups</h3>
      <button onclick="createGroup()" style="margin-top:12px">+ Create Group</button>
      <div id="groups-list" style="margin-top:12px"></div>
    </div>

    <!-- Leaderboard -->
    <div id="page-rank" class="hide">
      <h3>Leaderboard</h3>
      <div id="lb-list" class="card" style="margin-top:12px">Loading...</div>
    </div>
  </main>

  <nav>
    <button onclick="nav('dash', this)" class="active"><span>🏠</span>Home</button>
    <button onclick="nav('ai', this)"><span>🤖</span>Tutor</button>
    <button onclick="nav('chat', this)"><span>💬</span>Chat</button>
    <button onclick="nav('rank', this)"><span>🏆</span>Rank</button>
  </nav>
</div>

<!-- CHAT ROOM OVERLAY -->
<div id="chat-area">
  <div id="chat-header">
    <button onclick="closeChat()" style="width:auto; margin:0; background:none; font-size:20px;">←</button>
    <b id="chat-title">Room</b>
  </div>
  <div id="chat-messages"></div>
  <div class="chat-input-area">
    <button onclick="recordVoice()" style="background:transparent; padding:10px;" id="mic-btn">🎤</button>
    <input id="chat-input" placeholder="Message..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBalfqEksKXbrcfVCqrrWkILx_V7up25Xs",
  authDomain: "smart-learn-hub-73667.firebaseapp.com",
  projectId: "smart-learn-hub-73667",
  storageBucket: "smart-learn-hub-73667.firebasestorage.app",
  messagingSenderId: "165458065701",
  appId: "1:165458065701:web:08a1bcfac2ae286b9502cc"
};
const AI_URL = "https://gbaraneeleeleebari4--1fb7caf2c99a11f1ad4c1607ee4eb77e.web.val.run";
const CLOUD_NAME = "bj3niwog";
const CLOUD_PRESET = "smart_cgpa_preset";
const ADMIN_EMAIL = "gbaraneeleeleebari4@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let ME = null, currentRoom = null, mediaRecorder = null, audioChunks = [];

setTimeout(() => { document.getElementById('splash').classList.add('hide'); document.getElementById('auth').classList.remove('hide'); }, 2000);

// Auth Functions
window.login = async () => {
  const e = document.getElementById('email').value;
  const p = document.getElementById('pass').value;
  try { await signInWithEmailAndPassword(auth, e, p); } 
  catch (err) { document.getElementById('auth-msg').innerText = err.message; }
};
window.signup = async () => {
  const e = document.getElementById('email').value;
  const p = document.getElementById('pass').value;
  try { 
    const cred = await createUserWithEmailAndPassword(auth, e, p); 
    await setDoc(doc(db, "users", cred.user.uid), { email: e, role: e === ADMIN_EMAIL ? "admin" : "student" });
  } catch (err) { document.getElementById('auth-msg').innerText = err.message; }
};
window.googleLogin = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } 
  catch (err) { document.getElementById('auth-msg').innerText = err.message; }
};
window.logout = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById('auth').classList.add('hide');
    document.getElementById('app').style.display = 'flex';
    document.getElementById('user-email').innerText = user.email;
    const snap = await getDoc(doc(db, "users", user.uid));
    if(!snap.exists()) await setDoc(doc(db, "users", user.uid), { email: user.email, role: user.email === ADMIN_EMAIL ? "admin" : "student" });
    ME = { uid: user.uid, email: user.email, role: user.email === ADMIN_EMAIL ? "admin" : "student" };
    loadGroups(); loadLeaderboard();
  } else {
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth').classList.remove('hide');
  }
});

// Navigation
window.nav = (page, btn) => {
  document.querySelectorAll('main > div').forEach(d => d.classList.add('hide'));
  document.getElementById('page-' + page).classList.remove('hide');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
};

// AI Tutor
window.askAI = async () => {
  const input = document.getElementById('ai-input');
  const text = input.value.trim(); if(!text) return;
  const box = document.getElementById('ai-messages');
  box.innerHTML += `<div class="bubble mine">${text}</div>`;
  input.value = '';
  box.scrollTop = box.scrollHeight;
  
  const loading = document.createElement('div'); loading.className = 'bubble theirs'; loading.innerText = 'Thinking...';
  box.appendChild(loading);

  try {
    const res = await fetch(AI_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ messages: [{ role: 'user', content: text }] }) });
    const data = await res.json();
    loading.innerText = data.reply || "No response";
  } catch(e) { loading.innerText = "Error connecting to AI"; }
  box.scrollTop = box.scrollHeight;
};

// Chat System
window.loadGroups = () => {
  onSnapshot(collection(db, "groups"), (snap) => {
    const list = document.getElementById('groups-list');
    if(snap.empty) { list.innerHTML = "<p style='color:gray'>No groups yet.</p>"; return; }
    list.innerHTML = snap.docs.map(d => `<div class="card" style="cursor:pointer" onclick="openChat('${d.id}','${d.data().name}')"><b>${d.data().name}</b></div>`).join('');
  });
};
window.createGroup = async () => {
  const name = prompt("Group Name:");
  if(name) await addDoc(collection(db, "groups"), { name, owner: ME.uid, createdAt: serverTimestamp() });
};
window.openChat = (id, name) => {
  currentRoom = id; document.getElementById('chat-title').innerText = name;
  document.getElementById('chat-area').style.display = 'flex';
  onSnapshot(query(collection(db, "groups", id, "messages"), orderBy("createdAt", "asc")), (snap) => {
    const box = document.getElementById('chat-messages');
    box.innerHTML = snap.docs.map(d => {
      const m = d.data(); const mine = m.uid === ME.uid;
      let content = m.type === 'audio' ? `<audio controls src="${m.text}" style="max-width:100%"></audio>` : m.text;
      return `<div class="bubble ${mine ? 'mine' : 'theirs'}" ondblclick="delMsg('${d.id}')">
        ${!mine ? `<div style="font-size:10px;color:var(--brand);margin-bottom:4px">${m.name || 'User'}</div>` : ''}
        ${content}
      </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
};
window.closeChat = () => { document.getElementById('chat-area').style.display = 'none'; currentRoom = null; };
window.sendMessage = async () => {
  const input = document.getElementById('chat-input'); const text = input.value.trim(); if(!text) return;
  input.value = '';
  await addDoc(collection(db, "groups", currentRoom, "messages"), { text, uid: ME.uid, name: ME.email.split('@')[0], type: 'text', createdAt: serverTimestamp() });
};
window.delMsg = async (id) => {
  if(confirm("Delete this message?")) {
    try { await deleteDoc(doc(db, "groups", currentRoom, "messages", id)); } 
    catch(e) { alert("You cannot delete this message."); }
  }
};
window.recordVoice = async () => {
  if(mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); document.getElementById('mic-btn').style.color = 'white'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      const form = new FormData(); form.append('file', blob); form.append('upload_preset', CLOUD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {method: 'POST', body: form});
      const data = await res.json();
      await addDoc(collection(db, "groups", currentRoom, "messages"), { text: data.secure_url, uid: ME.uid, name: ME.email.split('@')[0], type: 'audio', createdAt: serverTimestamp() });
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start(); document.getElementById('mic-btn').style.color = 'red';
  } catch(e) { alert("Mic access denied"); }
};

// Leaderboard
window.loadLeaderboard = () => {
  onSnapshot(collection(db, "leaderboard"), snap => {
    const box = document.getElementById('lb-list');
    let items = []; snap.forEach(d => items.push(d.data()));
    items.sort((a,b) => b.score - a.score);
    box.innerHTML = items.length ? items.map((u,i) => `<div class="stat"><span>#${i+1} ${u.name}</span> <b>${u.score} pts</b></div>`).join('') : "No scores yet.";
  });
};

window.calc = () => { alert("Calculator UI ready for implementation."); };
</script>
</body>
</html>
